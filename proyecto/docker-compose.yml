version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: plataforma_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: plataforma_precios
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  locust:
    image: locustio/locust:latest
    container_name: plataforma_locust
    ports:
      - "8089:8089"
    volumes:
      - ./load-tests:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
